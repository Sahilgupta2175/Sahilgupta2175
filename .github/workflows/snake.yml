name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sahilgupta2175
          # Lime palette to match the profile's v3 look.
          outputs: |
            dist/github-snake.svg?color_snake=#0B0C09&color_dots=#ebedf0,#e4f5c4,#c8f169,#8fae3c,#4f6128
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C8F169&color_dots=#161b22,#2b3a12,#4f6128,#8fae3c,#c8f169

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
