name: Refresh profile

# Rebuilds README.md and assets/*.svg from profile.config.mjs plus live data
# (portfolio admin API, Hashnode posts via the portfolio, GitHub stats).
on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  # Every push, not just config/script changes: if a manual push ever lands
  # stale or conflicted generated files, this rebuild replaces them.
  push:
    branches: [main]

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard against merge-conflict markers
        run: |
          if grep -rlE '^(<<<<<<<|>>>>>>>) ' profile.config.mjs scripts; then
            echo "::error::Conflict markers in source files above; resolve them and push again."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build profile
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commits made with GITHUB_TOKEN don't trigger other workflows, so this
      # can't loop.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile" && git push)
