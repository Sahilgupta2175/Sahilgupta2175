<style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Bricolage Grotesque';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Hanken Grotesk';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
