<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="82" viewBox="0 0 1200 82" role="img" aria-label="Tech stack">
<title>Tech stack</title>
<style>@font-face{font-family:'Mona Sans';font-weight:400 850;font-stretch:100% 125%;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Martian Mono';font-weight:400;font-stretch:100%;src:url(data:font/woff2;base64,) format('woff2');}
.s{font-family:'Mona Sans','Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'Martian Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes blurin{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.blurin{animation:blurin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="44" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#1a7f37"/><stop offset=".33" stop-color="#0f7f71"/><stop offset=".66" stop-color="#0969da"/><stop offset="1" stop-color="#1a7f37"/>
  
</linearGradient></defs>
<g class="up">
  <rect x=".75" y="20.75" width="38.5" height="38.5" rx="10" fill="none" stroke="url(#g)" stroke-width="1.5"/>
  <g transform="translate(12 32)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linejoin="round"><path d="M8 1.5l6.5 3.5L8 8.5 1.5 5 8 1.5Z"/><path d="M1.5 8L8 11.5 14.5 8M1.5 11L8 14.5 14.5 11" stroke-linecap="round"/></g>
  <text x="56" y="50" class="s" font-size="28" font-weight="700" font-stretch="110%" letter-spacing="-.4" fill="#1f2328">Tech stack</text>
  <text x="1200" y="48" text-anchor="end" class="m" font-size="12" fill="#59636e">23 technologies</text>
</g>
<line x1="0" y1="81" x2="1200" y2="81" stroke="#e4e8ec"/>
</svg>