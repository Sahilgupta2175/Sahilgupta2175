<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Sahil Gupta. Full-stack developer. I design and build web products end to end: auth, payments, real-time features and the last pixel. Now at Cognizant as Programmer Analyst Trainee.">
<title>Sahil Gupta. Full-stack developer. I design and build web products end to end: auth, payments, real-time features and the last pixel. Now at Cognizant as Programmer Analyst Trainee.</title>
<style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Hanken Grotesk';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif}.b{font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.cue{transform-box:fill-box;animation:cue 2.2s cubic-bezier(.7,0,.3,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<mask id="hole"><rect width="1200" height="600" fill="#fff"/><circle cx="0" cy="243.12" r="118" fill="#000"><animateTransform attributeName="transform" type="translate" values="-200 0;-200 0;1400 0" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/></circle></mask>
<mask id="lens"><rect width="1200" height="600" fill="#000"/><circle cx="0" cy="243.12" r="118" fill="#fff"><animateTransform attributeName="transform" type="translate" values="-200 0;-200 0;1400 0" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/></circle></mask>
<rect x=".5" y=".5" width="1199" height="599" rx="28" fill="#000000" stroke="#22251C"/>
<clipPath id="card"><rect width="1200" height="600" rx="28"/></clipPath>
<rect width="1200" height="600" filter="url(#grain)" clip-path="url(#card)" opacity="0.07"/>

<text x="56" y="66" class="m" font-size="13" letter-spacing="1.6" fill="#8A887F" text-anchor="start">PORTFOLIO · 2026</text>
<text x="600" y="66" class="m" font-size="13" letter-spacing="1.6" fill="#8A887F" text-anchor="middle">FULL-STACK DEVELOPER</text>
<text x="1144" y="66" class="m" font-size="13" letter-spacing="1.6" fill="#8A887F" text-anchor="end">BANGALORE, IN</text>
<line x1="56" y1="90" x2="1144" y2="90" stroke="#22251C"/>

<g mask="url(#hole)">
    <g class="rise" style="animation-delay:120ms"><text x="56" y="300" textLength="483" lengthAdjust="spacingAndGlyphs" class="d" font-weight="800" font-size="158" fill="#EEEDE6" >SAHIL</text></g>
    <g class="rise" style="animation-delay:300ms"><text x="1144" y="300" text-anchor="end" textLength="535" lengthAdjust="spacingAndGlyphs" class="d" font-weight="800" font-size="158" fill="#EEEDE6" >GUPTA<tspan fill="#C8F169">.</tspan></text></g></g>
<g mask="url(#lens)">
    <g class="rise" style="animation-delay:120ms"><text x="56" y="300" textLength="483" lengthAdjust="spacingAndGlyphs" class="d" font-weight="800" font-size="158" fill="none" stroke="#C8F169" stroke-width="2.5">SAHIL</text></g>
    <g class="rise" style="animation-delay:300ms"><text x="1144" y="300" text-anchor="end" textLength="535" lengthAdjust="spacingAndGlyphs" class="d" font-weight="800" font-size="158" fill="none" stroke="#C8F169" stroke-width="2.5">GUPTA<tspan fill="none">.</tspan></text></g></g>
<circle cx="0" cy="243.12" r="118" fill="none" stroke="#C8F169" stroke-opacity=".35" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="translate" values="-200 0;-200 0;1400 0" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/></circle>

<g class="rise" style="animation-delay:520ms">
<text x="56" y="384" class="b" font-size="26" fill="#B4B2A8">I design and build web products end to end: auth,</text>
<text x="56" y="420" class="b" font-size="26" fill="#B4B2A8">payments, real-time features and the last pixel.</text>
</g>

<g class="rise" style="animation-delay:700ms">
  <rect x="56.5" y="495.5" width="438.0000000000003" height="44" rx="22" fill="none" stroke="#363A2C"/>
  <circle cx="82" cy="518" r="5" fill="#C8F169" class="pulse"/>
  <text x="98" y="523" class="m" font-size="14" fill="#B4B2A8">Now at Cognizant · Programmer Analyst Trainee</text>
</g>

<g class="rise" style="animation-delay:820ms">
  <text x="1118" y="524" class="m" font-size="13" letter-spacing="1.6" fill="#8A887F" text-anchor="end">SCROLL</text>
  <rect x="1143" y="490" width="1" height="56" fill="#363A2C"/>
  <rect x="1143" y="490" width="1" height="56" fill="#EEEDE6" class="cue"/>
</g>
</svg>