<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Writing">
<title>Writing</title>
<style>@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif}.b{font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="rise">
  <text x="4" y="112" class="d" font-weight="800" font-size="96" letter-spacing="-4" fill="#EEEDE6">Writing</text>
</g>
<line x1="0" y1="149" x2="1200" y2="149" stroke="#363A2C"/>
</svg>