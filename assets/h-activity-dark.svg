<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="82" viewBox="0 0 1200 82" role="img" aria-label="Contribution activity">
<title>Contribution activity</title>
<style>@font-face{font-family:'Mona Sans';font-weight:400 850;font-stretch:100% 125%;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Martian Mono';font-weight:400;font-stretch:100%;src:url(data:font/woff2;base64,) format('woff2');}
.s{font-family:'Mona Sans','Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'Martian Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes blurin{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.blurin{animation:blurin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="44" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#4493f8"/><stop offset=".33" stop-color="#ab7df8"/><stop offset=".66" stop-color="#f778ba"/><stop offset="1" stop-color="#4493f8"/>
  
</linearGradient></defs>
<g class="up">
  <rect x=".75" y="20.75" width="38.5" height="38.5" rx="10" fill="none" stroke="url(#g)" stroke-width="1.5"/>
  <g transform="translate(12 32)" fill="none" stroke="#f0f6fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5v13h13"/><path d="M4 10l3-3 2.5 2.5L14 5"/></g>
  <text x="56" y="50" class="s" font-size="28" font-weight="700" font-stretch="110%" letter-spacing="-.4" fill="#f0f6fc">Contribution activity</text>
  <text x="1200" y="48" text-anchor="end" class="m" font-size="12" fill="#9198a1">live from the GitHub API</text>
</g>
<line x1="0" y1="81" x2="1200" y2="81" stroke="#262c36"/>
</svg>